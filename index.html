              'Segoe UI Black': "'Segoe UI Black', 'Segoe UI', system-ui, sans-serif",

              'Fira Sans': "'Fira Sans', sans-serif",
              'Ubuntu': "'Ubuntu', sans-serif",
              'Manrope': "'Manrope', sans-serif",
              'Arial': "Arial, Helvetica, sans-serif",
              'Arial Black': "'Arial Black', 'Arial Bold', sans-serif",
              'Trebuchet MS': "'Trebuchet MS', sans-serif",

              'Caveat': "'Caveat', cursive",
              'Pacifico': "'Pacifico', cursive"
            };
            var css = fontMap[savedFont] || fontMap['system'] || 'system-ui, sans-serif';
            document.documentElement.style.setProperty('--main-font', css);
            document.documentElement.style.fontFamily = css;
          }
        } catch(e) {}
      })();
    </script>
