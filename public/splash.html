<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbita</title>
  <link rel="icon" type="image/x-icon" href="/icons/icon.ico" />
  <link rel="stylesheet" href="fonts/offline-fonts.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    :root {
      --main-font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Roboto, sans-serif;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--main-font);
    }
    .splash-container {
      width: 300px;
      height: 350px;
      border-radius: 10px;
      background: #121212;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      -webkit-app-region: drag;
      overflow: hidden;
    }
    .logo-container {
      width: 130px;
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.92);
      animation: logoReveal 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      -webkit-app-region: no-drag;
    }
    @keyframes logoReveal {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    .status-text {
      margin-top: 26px;
      font-size: 13.5px;
      font-weight: 600;
      color: #9f96b3;
      text-align: center;
      letter-spacing: 0.15px;
      height: 22px;
      line-height: 22px;
      max-width: 250px;
      white-space: nowrap;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.15s ease;
      -webkit-app-region: no-drag;
    }
    .dots {
      display: inline-flex;
      margin-left: 1px;
      letter-spacing: 0.5px;
    }
    .dot {
      display: inline-block;
      animation: dotPulse 1.4s ease-in-out infinite;
      opacity: 0.25;
      color: #9f96b3;
      font-weight: 700;
    }
    .dot:nth-child(1) {
      animation-delay: 0s;
    }
    .dot:nth-child(2) {
      animation-delay: 0.2s;
    }
    .dot:nth-child(3) {
      animation-delay: 0.4s;
    }
    @keyframes dotPulse {
      0%, 100% {
        opacity: 0.25;
        transform: translateY(0);
      }
      50% {
        opacity: 1;
        transform: translateY(-2px);
      }
    }

    @keyframes blockStep {
      0%, 15% {
        transform: translate(0, 0);
      }
      80%, 100% {
        transform: translate(85px, -85px);
      }
    }
    @keyframes blockEnter {
      0%, 15% {
        opacity: 0;
        transform: translate(0, 0);
      }
      80%, 100% {
        opacity: 1;
        transform: translate(85px, -85px);
      }
    }
    @keyframes blockExit {
      0%, 15% {
        opacity: 1;
        transform: translate(0, 0);
      }
      80%, 100% {
        opacity: 0;
        transform: translate(85px, -85px);
      }
    }

    .block-0 {
      animation: blockEnter 1.15s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
    }
    .block-1 {
      animation: blockStep 1.15s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
    }
    .block-2 {
      animation: blockStep 1.15s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
    }
    .block-3 {
      animation: blockExit 1.15s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="logo-container">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="100 100 800 800" width="130" height="130" aria-hidden="true">
        <defs>
          <linearGradient id="ringFill" x1="75%" y1="15%" x2="20%" y2="85%">
            <stop offset="0%" stop-color="#a894d1" />
            <stop offset="50%" stop-color="#917bbd" />
            <stop offset="100%" stop-color="#755f9f" />
          </linearGradient>

          <linearGradient id="ringStroke" x1="80%" y1="10%" x2="20%" y2="90%">
            <stop offset="0%" stop-color="#c0b0df" stop-opacity="0.85" />
            <stop offset="50%" stop-color="#917bbd" stop-opacity="0.5" />
            <stop offset="100%" stop-color="#7e69a8" stop-opacity="0.7" />
          </linearGradient>
        </defs>

        <path
          d="M 678.5 239.0 A 340 340 0 1 0 816.0 376.5 L 780.7 411.8 A 290 290 0 1 1 643.2 274.3 Z"
          fill="url(#ringFill)"
          stroke="url(#ringStroke)"
          stroke-width="3.5"
          stroke-linejoin="round"
        />

        <path
          d="M 603.7 313.8 A 240 240 0 1 0 741.2 451.3 L 705.2 487.3 A 190 190 0 1 1 567.7 349.8 Z"
          fill="url(#ringFill)"
          stroke="url(#ringStroke)"
          stroke-width="3.5"
          stroke-linejoin="round"
        />

        <g class="tetris-blocks">
          <rect class="block-0" x="520" y="440" width="85" height="85" rx="5" fill="#FFFFFF" />
          <rect class="block-1" x="605" y="355" width="85" height="85" rx="5" fill="#FFFFFF" />
          <rect class="block-2" x="690" y="270" width="85" height="85" rx="5" fill="#FFFFFF" />
          <rect class="block-3" x="775" y="185" width="85" height="85" rx="5" fill="#FFFFFF" />
        </g>
      </svg>
    </div>

    <div id="status" class="status-text">
      <span id="status-label">Checking for updates</span><span class="dots"><span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></span>
    </div>
  </div>

  <script>
    var enMap = {
      'Проверка обновлений': 'Checking for updates',
      'Загрузка компонентов': 'Loading components',
      'Подготовка интерфейса': 'Preparing interface',
      'Инициализация данных': 'Initializing data',
      'Загрузка аватарок и профилей': 'Loading avatars and profiles',
      'Запуск интерфейса': 'Starting',
      'Запуск': 'Starting'
    };

    window.setStatus = function(text) {
      var label = document.getElementById('status-label');
      var container = document.getElementById('status');
      if (!label || !text) return;
      var clean = text.replace(/[\.\s]+$/, '');
      var translated = enMap[clean] || clean;
      container.style.opacity = '0';
      setTimeout(function() {
        label.textContent = translated;
        container.style.opacity = '1';
      }, 100);
    };

    window.setFont = function(fontCss) {
      if (!fontCss) return;
      document.documentElement.style.setProperty('--main-font', fontCss);
      document.body.style.fontFamily = fontCss;
    };
  </script>
</body>
</html>
