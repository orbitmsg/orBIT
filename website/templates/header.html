</button>
<div id="language-options" class="language-options" role="listbox" aria-labelledby="language-button">
<div class="language-option" role="option" data-language="ru" aria-selected="true" tabindex="-1">Русский</div>
<div class="language-option" role="option" data-language="en" aria-selected="false" tabindex="-1">English</div>
<div class="language-option" role="option" data-language="uk" aria-selected="false" tabindex="-1">Українська</div>
<div class="language-option" role="option" data-language="be" aria-selected="false" tabindex="-1">Беларуская</div>
